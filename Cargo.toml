[package]
name = "form_builder"
version = "2.0.0"
edition = "2024"
authors = ["Mikołaj Gawron <gawrmiko@gmail.com>"]
description = "A library for building forms with various fields and validation."
license = "MIT"
repository = "https://github.com/vertyll/form-builder"
documentation = "https://docs.rs/form_builder"
readme = "README.md"
keywords = ["form", "builder", "validation", "fields", "input"]
categories = ["command-line-interface"]
exclude = [".github/", ".markright.toml"]

[workspace]
members = ["derive"]

[package.metadata.docs.rs]
all-features = true

[features]
derive = ["dep:form_builder_derive"]

[dependencies]
crossterm = "0.29.0"
regex = "1.13.1"
thiserror = "2.0.21"
form_builder_derive = { version = "=2.0.0", path = "derive", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
